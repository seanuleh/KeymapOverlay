name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          xcodebuild \
            -project KeymapOverlay.xcodeproj \
            -scheme KeymapOverlay \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Re-sign app bundle
        run: |
          APP=$(find build -name "KeymapOverlay.app" -maxdepth 5 | head -1)
          # Re-sign all embedded frameworks with the same ad-hoc identity so
          # Team IDs match (Sparkle ships pre-signed with a different Team ID)
          find "$APP" -name "*.framework" -o -name "*.dylib" | while read f; do
            codesign --force --sign - "$f"
          done
          codesign --force --sign - --entitlements KeymapOverlay/KeymapOverlay.entitlements "$APP"
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Package .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP" KeymapOverlay.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: KeymapOverlay
          path: KeymapOverlay.zip
          retention-days: 30
